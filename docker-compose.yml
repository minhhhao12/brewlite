name: brewlite

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile.dev

services:
  db:
    image: postgres:16-alpine
    container_name: brewlite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brewlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brewlite_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-brewlite} -d ${POSTGRES_DB:-brewlite}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build: *app-build
    image: brewlite-dev:local
    container_name: brewlite-api
    init: true
    working_dir: /app
    command: >
      sh -c "pnpm --filter @brewlite/api prisma:generate &&
             pnpm --filter @brewlite/api db:migrate:deploy &&
             pnpm --filter @brewlite/api db:seed &&
             pnpm --filter @brewlite/api start:dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-brewlite}:${POSTGRES_PASSWORD:-brewlite_local_only}@db:5432/${POSTGRES_DB:-brewlite}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-at-least-32-characters}
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3001},http://127.0.0.1:${WEB_PORT:-3001}
      LOG_LEVEL: info
      PAYMENT_PROVIDER: mock
      TSC_WATCHFILE: DynamicPriorityPolling
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/nest-cli.json:/app/apps/api/nest-cli.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: *app-build
    image: brewlite-dev:local
    container_name: brewlite-web
    init: true
    working_dir: /app
    command: pnpm --filter @brewlite/web dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3000}
      NEXT_TELEMETRY_DISABLED: '1'
      HOSTNAME: 0.0.0.0
      WATCHPACK_POLLING: 'true'
    ports:
      - '${WEB_PORT:-3001}:3001'
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/components:/app/apps/web/components
      - ./apps/web/lib:/app/apps/web/lib
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/next.config.ts:/app/apps/web/next.config.ts:ro
      - ./apps/web/tailwind.config.ts:/app/apps/web/tailwind.config.ts:ro
      - ./apps/web/postcss.config.mjs:/app/apps/web/postcss.config.mjs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
