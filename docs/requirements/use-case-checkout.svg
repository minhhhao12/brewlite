<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" style="width:680px;height:260px;background:#FFFFFF;" width="680px" height="260px" viewBox="0 0 680 260">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/>
    </marker>
    <marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9" fill="none" stroke="#333333" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="680" height="260" fill="#FFFFFF"/>

  <!-- System Boundary -->
  <rect x="130" y="20" width="390" height="215" rx="4" ry="4" fill="#FAFAFA" stroke="#333333" stroke-width="1.2"/>
  <text x="180" y="42" fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold">Hệ thống BrewLite – Thanh toán đơn hàng</text>

  <!-- Actor: Customer -->
  <g transform="translate(15, 80)">
    <circle cx="45" cy="20" r="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
    <line x1="45" y1="30" x2="45" y2="60" stroke="#333333" stroke-width="1.2"/>
    <line x1="25" y1="42" x2="65" y2="42" stroke="#333333" stroke-width="1.2"/>
    <line x1="45" y1="60" x2="28" y2="85" stroke="#333333" stroke-width="1.2"/>
    <line x1="45" y1="60" x2="62" y2="85" stroke="#333333" stroke-width="1.2"/>
    <text x="45" y="105" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Khách hàng</text>
  </g>

  <!-- Actor: Payment Gateway -->
  <g transform="translate(545, 95)">
    <circle cx="55" cy="20" r="10" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
    <line x1="55" y1="30" x2="55" y2="60" stroke="#333333" stroke-width="1.2"/>
    <line x1="35" y1="42" x2="75" y2="42" stroke="#333333" stroke-width="1.2"/>
    <line x1="55" y1="60" x2="38" y2="85" stroke="#333333" stroke-width="1.2"/>
    <line x1="55" y1="60" x2="72" y2="85" stroke="#333333" stroke-width="1.2"/>
    <text x="55" y="105" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Cổng thanh toán</text>
    <text x="55" y="120" fill="#666666" font-family="sans-serif" font-size="11" text-anchor="middle">(Mock Gateway)</text>
  </g>

  <!-- Use Case: Thanh toán đơn hàng -->
  <g id="uc-pay">
    <ellipse cx="230" cy="115" rx="80" ry="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
    <text x="230" y="119" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Thanh toán đơn hàng</text>
  </g>

  <!-- Use Case: Áp dụng mã khuyến mãi -->
  <g id="uc-promo">
    <ellipse cx="230" cy="190" rx="75" ry="20" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
    <text x="230" y="194" fill="#000000" font-family="sans-serif" font-size="11" text-anchor="middle">Áp dụng mã khuyến mãi</text>
  </g>

  <!-- Use Case: Xử lý thanh toán online -->
  <g id="uc-online-pay">
    <ellipse cx="430" cy="115" rx="75" ry="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.2"/>
    <text x="430" y="119" fill="#000000" font-family="sans-serif" font-size="11" text-anchor="middle">Xử lý thanh toán online</text>
  </g>

  <!-- Association: Customer to UC_Pay -->
  <line x1="85" y1="120" x2="148" y2="116" stroke="#333333" stroke-width="1.2"/>

  <!-- UC_Promo extend UC_Pay -->
  <line x1="230" y1="170" x2="230" y2="142" stroke="#333333" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="236" y="158" fill="#555555" font-family="sans-serif" font-size="10" font-style="italic">«extend»</text>

  <!-- UC_Pay include UC_OnlinePay -->
  <line x1="310" y1="115" x2="352" y2="115" stroke="#333333" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#open-arrow)"/>
  <text x="332" y="107" fill="#555555" font-family="sans-serif" font-size="10" font-style="italic" text-anchor="middle">«include»</text>

  <!-- Association: UC_OnlinePay to PaymentGateway -->
  <line x1="505" y1="115" x2="570" y2="128" stroke="#333333" stroke-width="1.2"/>
</svg>