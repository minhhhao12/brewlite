name: Continuous Integration (CI)

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Thiết lập môi trường Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # hoặc 'pnpm' / 'yarn' tùy package manager của nhóm

      # 3. Install - Cài đặt dependencies
      - name: Install Dependencies
        run: npm ci

      # 4. Lint - Kiểm tra chuẩn mã nguồn (Code Style & Syntax)
      - name: Run Linter
        run: |
          npm run lint --workspaces --if-present

      # 5. Unit Test - Chạy kiểm thử đơn vị
      - name: Run Unit Tests
        run: |
          npm run test --workspaces --if-present

      # 6. Build - Đóng gói ứng dụng (Next.js & NestJS)
      - name: Build Applications
        run: |
          npm run build --workspaces --if-present
